{{- if .Values.deployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "generic-app.fullname" . }}
  labels:
    {{- include "generic-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.deployment.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "generic-app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "generic-app.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "generic-app.fullname" . }}
      {{- else if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          env:
            {{- if .Values.trustBundle.enabled }}
            - name: SSL_CERT_FILE
              value: {{ .Values.trustBundle.mountPath }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.trustBundle.enabled }}
          volumeMounts:
            - name: ca-bundle
              mountPath: {{ .Values.trustBundle.mountPath }}
              subPath: {{ .Values.trustBundle.subPath }}
              readOnly: true
          {{- end }}
        {{- with .Values.sidecars }}
        {{- range . }}
        - name: {{ .name }}
          image: {{ .image }}
          {{- if .imagePullPolicy }}
          imagePullPolicy: {{ .imagePullPolicy }}
          {{- else }}
          imagePullPolicy: IfNotPresent
          {{- end }}
          {{- with .command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- if $.Values.trustBundle.enabled }}
            - name: SSL_CERT_FILE
              value: {{ $.Values.trustBundle.mountPath }}
            {{- end }}
            {{- with .env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $.Values.trustBundle.enabled }}
          volumeMounts:
            - name: ca-bundle
              mountPath: {{ $.Values.trustBundle.mountPath }}
              subPath: {{ $.Values.trustBundle.subPath }}
              readOnly: true
          {{- end }}
        {{- end }}
        {{- end }}
      {{- if .Values.trustBundle.enabled }}
      volumes:
        - name: ca-bundle
          configMap:
            name: {{ .Values.trustBundle.configMapName }}
      {{- end }}
{{- end }}
