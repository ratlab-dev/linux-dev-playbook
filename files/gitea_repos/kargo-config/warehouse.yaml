apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: commit-echoer
  namespace: commit-echoer
spec:
  freightCreationPolicy: Automatic
  interval: 1m
  subscriptions:
    # 1. Container Image Subscription (any newly built commit sha image tag)
    - image:
        repoURL: registry.ratlab.dev:8443/library/commit-echoer
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes:
          - "^[0-9a-f]{7,40}$"
        insecureSkipTLSVerify: true

    # 2. Helm Chart Subscription (semver minor and patch version upgrades)
    - chart:
        repoURL: oci://registry.ratlab.dev:8443/library/generic-app
        semverConstraint: "^0.1.0"
        insecureSkipTLSVerify: true
