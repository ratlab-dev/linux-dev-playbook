apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trust-bundle
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://git.ratlab.dev:3000/admin/gitops.git
    targetRevision: HEAD
    path: apps/trust-bundle
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
