apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-sa
  namespace: vault-secret-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-secret-demo
  namespace: vault-secret-demo
  labels:
    app: vault-secret-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-secret-demo
  template:
    metadata:
      labels:
        app: vault-secret-demo
    spec:
      serviceAccountName: demo-sa
      containers:
      - name: demo
        image: curlimages/curl:8.10.1
        command:
        - "/bin/sh"
        - "-c"
        - |
          echo "Vault SA secret reader running..."
          while true; do
            sleep 3600
          done
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 32Mi
