---
- name: Provision and Configure Linux Devbox
  hosts: devbox
  become: true
  pre_tasks:
    - name: Ensure Root CA certificate exists on controller (fetch from YubiKey if missing)
      block:
        - name: Check if Root CA certificate exists in files/certs on controller
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/../files/certs/ratlab-root-ca.crt"
          register: controller_root_ca_stat
          delegate_to: localhost
          become: false
          run_once: true

        - name: Fetch Root CA certificate from YubiKey when missing on controller
          block:
            - name: Check if YubiKey is connected to controller
              ansible.builtin.command: ykman list
              delegate_to: localhost
              become: false
              register: ykman_list_check
              changed_when: false
              failed_when: false
              run_once: true

            - name: Prompt user to connect YubiKey if not detected
              ansible.builtin.pause:
                prompt: |

                  ================================================================================
                  ROOT CA CERTIFICATE NOT FOUND ON CONTROLLER (files/certs/ratlab-root-ca.crt)
                  1. Connect your YubiKey Root CA to this Mac.
                  2. Press [ENTER] to extract the Root CA certificate...
                  ================================================================================
              when: ykman_list_check.rc != 0 or (ykman_list_check.stdout | trim | length == 0)

            - name: Export Root CA certificate from YubiKey on controller
              ansible.builtin.command: "{{ playbook_dir }}/../scripts/fetch_root_ca_from_yubikey.sh {{ playbook_dir }}/../files/certs/ratlab-root-ca.crt"
              delegate_to: localhost
              become: false
              run_once: true
              register: yubikey_root_ca_export
              changed_when: "'Successfully fetched' in yubikey_root_ca_export.stdout"
          when: not controller_root_ca_stat.stat.exists or controller_root_ca_stat.stat.size == 0
      tags: [always]

    - name: Validate that all ports in ratlab_ports registry are strictly unique
      ansible.builtin.assert:
        that:
          - (ratlab_ports.values() | list | length) == (ratlab_ports.values() | unique | list | length)
        fail_msg: "Duplicate port detected in ratlab_ports! Each service must have a dedicated unique port."
        success_msg: "All {{ ratlab_ports.values() | list | length }} service ports in ratlab_ports are unique."
      tags: [always]

    - name: Detect Tailscale IPv4 address for dynamic DNS and host records
      ansible.builtin.command: tailscale ip -4
      register: devbox_ts_ip
      changed_when: false
      failed_when: false
      tags: [always]

    - name: Set tailscale_node_ip fact for all roles
      ansible.builtin.set_fact:
        tailscale_node_ip: "{{ devbox_ts_ip.stdout.strip() if (devbox_ts_ip.rc == 0 and devbox_ts_ip.stdout.strip() | length > 0) else (ansible_host | default(ansible_default_ipv4.address)) }}"
      tags: [always]

  roles:
    - role: baseline
      tags: [baseline]

    - role: tailscale
      tags: [tailscale]
      when: tailscale_auth_key is defined or tailscale_ssh | default(true)

    - role: dns
      tags: [dns]
      when: dns_server_enable | default(true) | bool

    - role: docker
      tags: [docker]
      when: docker_enable | default(true) | bool

    - role: openbao
      tags: [openbao]
      when: openbao_enable | default(true) | bool

    - role: gitea
      tags: [gitea]
      when: gitea_enable | default(true) | bool

    - role: jenkins
      tags: [jenkins]
      when: jenkins_enable | default(true) | bool

    - role: harbor
      tags: [harbor]
      when: harbor_enable | default(true) | bool

    - role: kind_cluster
      tags: [kind, kind_cluster]
      when: kind_enable | default(true) | bool

    - role: argocd
      tags: [argocd]
      when: argocd_enable | default(true) | bool

    - role: verify
      tags: [verify]
