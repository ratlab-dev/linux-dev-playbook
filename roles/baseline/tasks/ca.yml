---
# Custom CA certificate installation tasks

- name: Determine system CA trust directory
  ansible.builtin.set_fact:
    ca_trust_dir: "{{ {'Debian': '/usr/local/share/ca-certificates/custom', 'RedHat': '/etc/pki/ca-trust/source/anchors', 'Archlinux': '/etc/ca-certificates/trust-source/anchors'}[ansible_os_family] | default('/usr/local/share/ca-certificates/custom') }}"
    ca_update_cmd: "{{ {'Debian': 'update-ca-certificates', 'RedHat': 'update-ca-trust extract', 'Archlinux': 'trust extract-compat'}[ansible_os_family] | default('update-ca-certificates') }}"

- name: Ensure custom CA trust directory exists
  ansible.builtin.file:
    path: "{{ ca_trust_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure Root CA certificate exists on controller (fetch from YubiKey if missing)
  block:
    - name: Check if Root CA certificate exists in files/certs on controller
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../files/certs/ratlab-root-ca.crt"
      register: baseline_root_ca_stat
      delegate_to: localhost
      become: false
      run_once: true

    - name: Fetch Root CA certificate from YubiKey when missing on controller
      block:
        - name: Check if YubiKey is connected to controller
          ansible.builtin.command: ykman list
          delegate_to: localhost
          become: false
          register: ykman_list_check_baseline
          changed_when: false
          failed_when: false
          run_once: true

        - name: Prompt user to connect YubiKey if not detected
          ansible.builtin.pause:
            prompt: |

              ================================================================================
              ROOT CA CERTIFICATE NOT FOUND ON CONTROLLER (files/certs/ratlab-root-ca.crt)
              1. Connect your YubiKey Root CA to this Mac.
              2. Press [ENTER] to extract the Root CA certificate...
              ================================================================================
          when: ykman_list_check_baseline.rc != 0 or (ykman_list_check_baseline.stdout | trim | length == 0)

        - name: Export Root CA certificate from YubiKey on controller
          ansible.builtin.command: "{{ playbook_dir }}/../scripts/fetch_root_ca_from_yubikey.sh {{ playbook_dir }}/../files/certs/ratlab-root-ca.crt"
          delegate_to: localhost
          become: false
          run_once: true
          register: yubikey_root_ca_export_baseline
          changed_when: "'Successfully fetched' in yubikey_root_ca_export_baseline.stdout"
      when: not baseline_root_ca_stat.stat.exists or baseline_root_ca_stat.stat.size == 0
  tags: [baseline, ca, always]

- name: Find custom CA certificate files in files/certs on controller
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/../files/certs"
    patterns:
      - '*.crt'
      - '*.pem'
    excludes:
      - 'openbao.crt'
      - '*.csr'
  register: local_ca_certs
  delegate_to: localhost
  become: false
  run_once: true

- name: Copy custom CA certificates to system trust directory
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ ca_trust_dir }}/{{ item.path | basename | regex_replace('\\.pem$', '.crt') }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ local_ca_certs.files }}"
  register: copied_ca_files
  when: local_ca_certs.files is defined and local_ca_certs.files | length > 0

- name: Install raw custom CA certificates defined in variables
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ ca_trust_dir }}/{{ item.name }}.crt"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ baseline_custom_cas }}"
  register: copied_raw_cas
  when: baseline_custom_cas is defined and baseline_custom_cas | length > 0

- name: Update system CA trust store
  ansible.builtin.command: "{{ ca_update_cmd }}"
  when: (copied_ca_files is changed) or (copied_raw_cas is changed)
  changed_when: true
