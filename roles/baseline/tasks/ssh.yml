---
# SSH server setup and root authorized keys configuration

- name: Ensure OpenSSH server package is installed (Debian)
  ansible.builtin.apt:
    name: openssh-server
    state: present
  when: ansible_os_family == 'Debian'

- name: Ensure OpenSSH server package is installed (RedHat)
  ansible.builtin.dnf:
    name: openssh-server
    state: present
  when: ansible_os_family == 'RedHat'

- name: Ensure OpenSSH server package is installed (Arch)
  ansible.builtin.pacman:
    name: openssh
    state: present
  when: ansible_os_family == 'Archlinux'

- name: Ensure /etc/ssh/sshd_config.d directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Ensure sshd_config includes sshd_config.d/*.conf
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    state: present
    insertafter: BOF
  notify: restart ssh

- name: Deploy baseline sshd drop-in configuration
  ansible.builtin.template:
    src: 00-baseline-sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/00-baseline.conf
    owner: root
    group: root
    mode: '0644'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: restart ssh

- name: Ensure /root/.ssh directory exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy authorized keys for root user from variables
  ansible.posix.authorized_key:
    user: root
    state: present
    key: "{{ item }}"
  loop: "{{ baseline_root_authorized_keys }}"
  when: baseline_root_authorized_keys is defined and baseline_root_authorized_keys | length > 0

- name: Deploy authorized keys for root user from files/keys/root.keys
  ansible.posix.authorized_key:
    user: root
    state: present
    key: "{{ lookup('file', playbook_dir ~ '/../files/keys/root.keys', errors='ignore') | default('', true) }}"
  when: (lookup('file', playbook_dir ~ '/../files/keys/root.keys', errors='ignore') | default('', true)) | length > 0

- name: Deploy authorized keys from legacy files/authorized_keys (if present)
  ansible.posix.authorized_key:
    user: root
    state: present
    key: "{{ lookup('file', playbook_dir ~ '/../files/authorized_keys', errors='ignore') | default('', true) }}"
  when: (lookup('file', playbook_dir ~ '/../files/authorized_keys', errors='ignore') | default('', true)) | length > 0

- name: Ensure SSH service is enabled and started (Debian)
  ansible.builtin.service:
    name: ssh
    enabled: true
    state: started
  when: ansible_os_family == 'Debian'

- name: Ensure SSH service is enabled and started (RedHat/Arch)
  ansible.builtin.service:
    name: sshd
    enabled: true
    state: started
  when: ansible_os_family in ['RedHat', 'Archlinux']

- name: Check if ufw is installed
  ansible.builtin.command: which ufw
  register: ufw_check
  changed_when: false
  failed_when: false

- name: Allow SSH on port 22 in UFW
  ansible.builtin.command: "ufw allow {{ baseline_ssh_port | string }}/tcp"
  when: ufw_check.rc == 0
  changed_when: false
