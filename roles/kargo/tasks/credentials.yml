---
# Tasks for managing Kargo shared credentials in Kubernetes

- name: Identify management cluster for Kargo
  ansible.builtin.set_fact:
    mgmt_cluster: "{{ (kind_clusters | selectattr('is_management_cluster', 'defined') | selectattr('is_management_cluster', 'equalto', true) | first) | default(kind_clusters[0]) }}"
  when: mgmt_cluster is not defined

- name: Set management cluster kubeconfig
  ansible.builtin.set_fact:
    kargo_kubeconfig: "/root/.kube/{{ mgmt_cluster.name }}.kubeconfig"
  when: kargo_kubeconfig is not defined

- name: Ensure kargo-shared-resources and kargo namespaces exist
  ansible.builtin.shell: |
    {{ kind_install_dir }}/kubectl --kubeconfig {{ kargo_kubeconfig }} create ns kargo-shared-resources --dry-run=client -o yaml | \
    {{ kind_install_dir }}/kubectl --kubeconfig {{ kargo_kubeconfig }} apply -f -
    {{ kind_install_dir }}/kubectl --kubeconfig {{ kargo_kubeconfig }} create ns kargo --dry-run=client -o yaml | \
    {{ kind_install_dir }}/kubectl --kubeconfig {{ kargo_kubeconfig }} apply -f -
  changed_when: false

- name: Ensure Kargo webhook TLS certificates and secret exist
  ansible.builtin.shell: |
    if ! {{ kind_install_dir }}/kubectl --kubeconfig {{ kargo_kubeconfig }} get secret kargo-webhooks-server-cert -n kargo >/dev/null 2>&1; then
      CERT_DIR=$(mktemp -d)
      openssl genrsa -out $CERT_DIR/ca.key 2048
      openssl req -x509 -new -nodes -key $CERT_DIR/ca.key -subj '/CN=kargo-webhook-ca' -days 3650 -out $CERT_DIR/ca.crt
      openssl genrsa -out $CERT_DIR/tls.key 2048
      openssl req -new -key $CERT_DIR/tls.key -subj '/CN=kargo-webhooks-server.kargo.svc' -out $CERT_DIR/tls.csr
      cat << 'EXT' > $CERT_DIR/extfile.cnf
subjectAltName = @alt_names
[alt_names]
DNS.1 = kargo-webhooks-server
DNS.2 = kargo-webhooks-server.kargo
DNS.3 = kargo-webhooks-server.kargo.svc
DNS.4 = kargo-webhooks-server.kargo.svc.cluster.local
EXT
      openssl x509 -req -in $CERT_DIR/tls.csr -CA $CERT_DIR/ca.crt -CAkey $CERT_DIR/ca.key -CAcreateserial -out $CERT_DIR/tls.crt -days 3650 -extfile $CERT_DIR/extfile.cnf
      {{ kind_install_dir }}/kubectl --kubeconfig {{ kargo_kubeconfig }} create secret tls kargo-webhooks-server-cert -n kargo --cert=$CERT_DIR/tls.crt --key=$CERT_DIR/tls.key
      rm -rf $CERT_DIR
    fi
  changed_when: false

- name: Deploy Gitea shared credentials for Kargo
  ansible.builtin.shell: |
    cat <<EOF | {{ kind_install_dir }}/kubectl --kubeconfig {{ kargo_kubeconfig }} apply -f -
    apiVersion: v1
    kind: Secret
    metadata:
      name: gitea-credentials
      namespace: kargo-shared-resources
      labels:
        kargo.akuity.io/cred-type: git
    type: Opaque
    stringData:
      repoURL: https://git.{{ internal_domain | default('ratlab.dev') }}
      repoURLIsRegex: "true"
      username: admin
      password: {{ gitea_admin_password | default('admin') }}
    EOF
  changed_when: false

- name: Deploy Harbor shared image and helm credentials for Kargo
  ansible.builtin.shell: |
    cat <<EOF | {{ kind_install_dir }}/kubectl --kubeconfig {{ kargo_kubeconfig }} apply -f -
    apiVersion: v1
    kind: Secret
    metadata:
      name: harbor-image-credentials
      namespace: kargo-shared-resources
      labels:
        kargo.akuity.io/cred-type: image
    type: Opaque
    stringData:
      repoURL: {{ harbor_domain | default('registry.' ~ (internal_domain | default('ratlab.dev'))) }}:{{ (ratlab_ports | default({})).nginx_https_alt | default(8443) }}
      repoURLIsRegex: "true"
      username: admin
      password: {{ harbor_admin_password | default('admin') }}
    ---
    apiVersion: v1
    kind: Secret
    metadata:
      name: harbor-helm-credentials
      namespace: kargo-shared-resources
      labels:
        kargo.akuity.io/cred-type: helm
    type: Opaque
    stringData:
      repoURL: {{ harbor_domain | default('registry.' ~ (internal_domain | default('ratlab.dev'))) }}:{{ (ratlab_ports | default({})).nginx_https_alt | default(8443) }}
      repoURLIsRegex: "true"
      username: admin
      password: {{ harbor_admin_password | default('admin') }}
    EOF
  changed_when: false
