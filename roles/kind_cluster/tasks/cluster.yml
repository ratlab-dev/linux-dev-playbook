---
# Tasks to provision a single Kind cluster and configure networking

- name: Set facts for cluster {{ current_cluster.name }}
  ansible.builtin.set_fact:
    cluster_kubeconfig: "/root/.kube/{{ current_cluster.name }}.kubeconfig"
    cluster_cert_path: "{{ kind_tls_dir }}/{{ current_cluster.name }}.crt"
    cluster_key_path: "{{ kind_tls_dir }}/{{ current_cluster.name }}.key"

- name: Issue TLS certificate for {{ current_cluster.name }} via OpenBao PKI
  block:
    - name: Check if cluster TLS certificate already exists
      ansible.builtin.stat:
        path: "{{ cluster_cert_path }}"
      register: cluster_cert_stat

    - name: Issue certificate from OpenBao Intermediate CA
      ansible.builtin.command: >-
        {{ openbao_install_dir }}/bao write -format=json {{ openbao_pki_mount }}/issue/{{ openbao_pki_role }}
        common_name="{{ current_cluster.domain }}"
        {% if current_cluster.alt_domain is defined and current_cluster.alt_domain.endswith('ratlab.dev') %}alt_names="{{ current_cluster.alt_domain }}"{% endif %}
      environment:
        VAULT_ADDR: "http://127.0.0.1:{{ openbao_port }}"
        VAULT_TOKEN: "{{ openbao_init_data.root_token }}"
      register: issued_cluster_cert_raw
      when: not cluster_cert_stat.stat.exists

    - name: Save cluster certificate
      ansible.builtin.copy:
        content: "{{ (issued_cluster_cert_raw.stdout | from_json).data.certificate }}\n{{ (issued_cluster_cert_raw.stdout | from_json).data.issuing_ca }}"
        dest: "{{ cluster_cert_path }}"
        owner: root
        group: root
        mode: '0644'
      when: not cluster_cert_stat.stat.exists

    - name: Save cluster private key
      ansible.builtin.copy:
        content: "{{ (issued_cluster_cert_raw.stdout | from_json).data.private_key }}"
        dest: "{{ cluster_key_path }}"
        owner: root
        group: root
        mode: '0600'
      when: not cluster_cert_stat.stat.exists
  when: not (certbot_enable | default(false) | bool)

- name: Deploy Let's Encrypt wildcard certificate for {{ current_cluster.name }}
  block:
    - name: Copy Let's Encrypt certificate to cluster cert path
      ansible.builtin.copy:
        src: /etc/ssl/certs/ratlab_wildcard.crt
        dest: "{{ cluster_cert_path }}"
        remote_src: true
        owner: root
        group: root
        mode: '0644'

    - name: Copy Let's Encrypt key to cluster key path
      ansible.builtin.copy:
        src: /etc/ssl/private/ratlab_wildcard.key
        dest: "{{ cluster_key_path }}"
        remote_src: true
        owner: root
        group: root
        mode: '0600'
  when: certbot_enable | default(false) | bool

- name: Render Kind cluster configuration
  ansible.builtin.template:
    src: kind-config.yaml.j2
    dest: "{{ kind_config_dir }}/{{ current_cluster.name }}.yaml"
    owner: root
    group: root
    mode: '0640'

- name: Check if Kind cluster {{ current_cluster.name }} exists
  ansible.builtin.command: "{{ kind_install_dir }}/kind get clusters"
  register: existing_clusters
  changed_when: false

- name: Create Kind cluster {{ current_cluster.name }}
  ansible.builtin.command: >-
    {{ kind_install_dir }}/kind create cluster
    --name {{ current_cluster.name }}
    --config {{ kind_config_dir }}/{{ current_cluster.name }}.yaml
    --kubeconfig {{ cluster_kubeconfig }}
  when: current_cluster.name not in existing_clusters.stdout_lines
  changed_when: true

- name: Set default kubeconfig for management cluster
  ansible.builtin.copy:
    src: "{{ cluster_kubeconfig }}"
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: '0600'
  when: current_cluster.is_management_cluster | default(false)

- name: Wait for Kubernetes nodes to be Ready
  ansible.builtin.command: >-
    {{ kind_install_dir }}/kubectl --kubeconfig {{ cluster_kubeconfig }}
    wait --for=condition=Ready nodes --all --timeout=120s
  changed_when: false

- name: Configure CoreDNS forwarding for internal domains
  block:
    - name: Fetch current Corefile from coredns ConfigMap
      ansible.builtin.command: >-
        {{ kind_install_dir }}/kubectl --kubeconfig {{ cluster_kubeconfig }}
        get cm coredns -n kube-system -o jsonpath='{.data.Corefile}'
      register: current_corefile
      changed_when: false

    - name: Deploy CoreDNS update script from template
      ansible.builtin.template:
        src: update-coredns.py.j2
        dest: /tmp/update-coredns.py
        owner: root
        group: root
        mode: '0700'

    - name: Execute CoreDNS forwarder update script
      ansible.builtin.command: python3 /tmp/update-coredns.py
      register: coredns_patch_result
      changed_when: "'successfully patched' in coredns_patch_result.stdout"

    - name: Remove temporary update script
      ansible.builtin.file:
        path: /tmp/update-coredns.py
        state: absent

- name: Enable strictARP in kube-proxy for future MetalLB support
  ansible.builtin.shell: |
    {{ kind_install_dir }}/kubectl --kubeconfig {{ cluster_kubeconfig }} get configmap kube-proxy -n kube-system -o yaml | \
    sed -e "s/strictARP: false/strictARP: true/" | \
    {{ kind_install_dir }}/kubectl --kubeconfig {{ cluster_kubeconfig }} apply -f - -n kube-system
  changed_when: false

- name: Deploy Ratlab CA certificates and Cluster TLS secret into Kubernetes
  block:
    - name: Ensure CA certificate files exist for Kubernetes ConfigMap
      block:
        - name: Ensure certificate directories exist on devbox
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: '0755'
          loop:
            - /etc/openbao/tls
            - /etc/ssl/certs

        - name: Retrieve intermediate CA from OpenBao API if missing on devbox
          ansible.builtin.shell: |
            if [ ! -s /etc/openbao/tls/intermediate.crt ]; then
              curl -fsSL http://127.0.0.1:{{ openbao_port | default(8200) }}/v1/{{ openbao_pki_mount | default('pki_ratlab') }}/ca/pem -o /etc/openbao/tls/intermediate.crt 2>/dev/null || true
            fi
            if [ -s /etc/openbao/tls/intermediate.crt ]; then
              cp -f /etc/openbao/tls/intermediate.crt /etc/ssl/certs/intermediate.crt
              chmod 644 /etc/openbao/tls/intermediate.crt /etc/ssl/certs/intermediate.crt
            fi
          changed_when: false

        - name: Ensure Root CA certificate is available on controller
          ansible.builtin.command: "{{ playbook_dir }}/../scripts/fetch_root_ca_from_yubikey.sh {{ playbook_dir }}/../files/certs/ratlab-root-ca.crt"
          delegate_to: localhost
          become: false
          when: not (lookup('file', playbook_dir ~ '/../files/certs/ratlab-root-ca.crt', errors='ignore') | length > 0)
          changed_when: true

        - name: Deploy CA certificates from controller if available
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../files/certs/{{ item.src }}"
            dest: "{{ item.dest }}"
            owner: root
            group: root
            mode: '0644'
          loop:
            - { src: "intermediate.crt", dest: "/etc/openbao/tls/intermediate.crt" }
            - { src: "intermediate.crt", dest: "/etc/ssl/certs/intermediate.crt" }
            - { src: "ratlab-root-ca.crt", dest: "/etc/ssl/certs/ratlab-root-ca.pem" }
            - { src: "ratlab-root-ca.crt", dest: "/etc/ssl/certs/ratlab-root-ca.crt" }
          when: (lookup('file', playbook_dir ~ '/../files/certs/' ~ item.src, errors='ignore') | length > 0)

        - name: Ensure Root CA certificate symlink or file exists on devbox
          ansible.builtin.shell: |
            if [ ! -s /etc/ssl/certs/ratlab-root-ca.pem ]; then
              if [ -s /usr/local/share/ca-certificates/custom/ratlab-root-ca.crt ]; then
                cp -f /usr/local/share/ca-certificates/custom/ratlab-root-ca.crt /etc/ssl/certs/ratlab-root-ca.pem
              elif [ -s /etc/ssl/certs/ratlab-root-ca.crt ]; then
                cp -f /etc/ssl/certs/ratlab-root-ca.crt /etc/ssl/certs/ratlab-root-ca.pem
              fi
            fi
            if [ -s /etc/ssl/certs/ratlab-root-ca.pem ]; then
              chmod 644 /etc/ssl/certs/ratlab-root-ca.pem
            fi
          changed_when: false

    - name: Create CA certificates ConfigMap in kube-system and default
      ansible.builtin.shell: |
        {{ kind_install_dir }}/kubectl --kubeconfig {{ cluster_kubeconfig }} create configmap ratlab-ca \
          --from-file=ratlab-root-ca.crt=/etc/ssl/certs/ratlab-root-ca.pem \
          --from-file=intermediate.crt=/etc/openbao/tls/intermediate.crt \
          -n {{ item }} --dry-run=client -o yaml | \
        {{ kind_install_dir }}/kubectl --kubeconfig {{ cluster_kubeconfig }} apply -f -
      loop:
        - kube-system
        - default
      changed_when: false

    - name: Create cluster TLS secret in kube-system and default
      ansible.builtin.shell: |
        {{ kind_install_dir }}/kubectl --kubeconfig {{ cluster_kubeconfig }} create secret tls cluster-tls-cert \
          --cert={{ cluster_cert_path }} \
          --key={{ cluster_key_path }} \
          -n {{ item }} --dry-run=client -o yaml | \
        {{ kind_install_dir }}/kubectl --kubeconfig {{ cluster_kubeconfig }} apply -f -
      loop:
        - kube-system
        - default
      changed_when: false

- name: Configure OpenBao / Vault Kubernetes Trust for {{ current_cluster.name }}
  ansible.builtin.import_tasks: vault_trust.yml

- name: Expose {{ current_cluster.name }} Kubernetes API through Nginx reverse proxy
  block:
    - name: Ensure Nginx websocket connection upgrade map exists
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/websocket-map.conf
        content: |
          map $http_upgrade $connection_upgrade {
              default upgrade;
              ''      close;
          }
        owner: root
        group: root
        mode: '0644'

    - name: Deploy Nginx reverse proxy site for {{ current_cluster.name }}
      ansible.builtin.template:
        src: k8s-cluster.nginx.conf.j2
        dest: "/etc/nginx/sites-available/k8s-{{ current_cluster.name }}.conf"
        owner: root
        group: root
        mode: '0644'

    - name: Enable Nginx site for {{ current_cluster.name }}
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/k8s-{{ current_cluster.name }}.conf"
        dest: "/etc/nginx/sites-enabled/k8s-{{ current_cluster.name }}.conf"
        state: link

    - name: Ensure dynamic dnsmasq hosts directory exists
      ansible.builtin.file:
        path: /etc/dnsmasq.hosts.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Register {{ current_cluster.name }} domain in dynamic dnsmasq hosts
      ansible.builtin.copy:
        dest: "/etc/dnsmasq.hosts.d/k8s-{{ current_cluster.name }}.hosts"
        content: |
          {% for dom in [current_cluster.domain, (current_cluster.alt_domain | default(''))] | select | unique %}
          {% if tailscale_node_ip is defined and tailscale_node_ip | length > 0 %}
          {{ tailscale_node_ip }} {{ dom }}
          {% endif %}
          {% if (ansible_default_ipv4 | default({})).address is defined and ansible_default_ipv4.address != (tailscale_node_ip | default('')) %}
          {{ ansible_default_ipv4.address }} {{ dom }}
          {% endif %}
          {% endfor %}
        owner: root
        group: root
        mode: '0644'

    - name: Ensure cluster domain is resolved locally in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 {{ current_cluster.domain }}{% if current_cluster.alt_domain is defined %} {{ current_cluster.alt_domain }}{% endif %}"
        state: present

    - name: Reload Nginx to activate cluster proxy
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Configure Root CA and DNS host resolution inside all Kind cluster nodes
      ansible.builtin.shell: |
        NODES=$(docker ps --filter "label=io.x-k8s.kind.cluster={{ current_cluster.name }}" --format "{% raw %}{{.Names}}{% endraw %}")
        for node in $NODES; do
          if [ -s /etc/ssl/certs/ratlab-root-ca.pem ]; then
            docker cp /etc/ssl/certs/ratlab-root-ca.pem "${node}:/usr/local/share/ca-certificates/ratlab-ca.crt"
            docker exec "${node}" update-ca-certificates >/dev/null 2>&1 || true
            docker exec "${node}" systemctl restart containerd >/dev/null 2>&1 || true
          fi
          docker exec "${node}" sh -c '
            HOSTS_LINE="{{ tailscale_node_ip }} {{ harbor_domain | default("registry." ~ internal_domain) }} {{ gitea_domain | default("git." ~ internal_domain) }} {{ jenkins_domain | default("jenkins." ~ internal_domain) }}"
            grep -qF "{{ harbor_domain | default("registry." ~ internal_domain) }}" /etc/hosts || echo "${HOSTS_LINE}" >> /etc/hosts
          '
        done
      changed_when: false

- name: Create cluster-admin ServiceAccount and generate long-lived token
  block:
    - name: Create cluster-admin-sa ServiceAccount
      ansible.builtin.shell: |
        {{ kind_install_dir }}/kubectl --kubeconfig {{ cluster_kubeconfig }} create sa cluster-admin-sa -n kube-system --dry-run=client -o yaml | \
        {{ kind_install_dir }}/kubectl --kubeconfig {{ cluster_kubeconfig }} apply -f -

        {{ kind_install_dir }}/kubectl --kubeconfig {{ cluster_kubeconfig }} create clusterrolebinding cluster-admin-sa-binding \
          --clusterrole=cluster-admin \
          --serviceaccount=kube-system:cluster-admin-sa \
          --dry-run=client -o yaml | \
        {{ kind_install_dir }}/kubectl --kubeconfig {{ cluster_kubeconfig }} apply -f -
      changed_when: false

    - name: Generate long-lived admin token for {{ current_cluster.name }}
      ansible.builtin.command: >-
        {{ kind_install_dir }}/kubectl --kubeconfig {{ cluster_kubeconfig }}
        create token cluster-admin-sa -n kube-system --duration=87600h
      register: generated_cluster_admin_token
      changed_when: false

    - name: Save admin token to /root/.kube/{{ current_cluster.name }}-admin.token
      ansible.builtin.copy:
        content: "{{ generated_cluster_admin_token.stdout | trim }}"
        dest: "/root/.kube/{{ current_cluster.name }}-admin.token"
        owner: root
        group: root
        mode: '0600'

- name: Configure Jenkins devbox user access to {{ current_cluster.name }}
  block:
    - name: Ensure Jenkins devbox user has kubeconfig directory
      ansible.builtin.file:
        path: /var/lib/jenkins/.kube
        state: directory
        owner: "{{ jenkins_user | default('jenkins') }}"
        group: "{{ jenkins_group | default('jenkins') }}"
        mode: '0750'

    - name: Copy cluster kubeconfig for Jenkins service user
      ansible.builtin.copy:
        src: "{{ cluster_kubeconfig }}"
        dest: /var/lib/jenkins/.kube/config
        remote_src: true
        owner: "{{ jenkins_user | default('jenkins') }}"
        group: "{{ jenkins_group | default('jenkins') }}"
        mode: '0600'

    - name: Deploy Kubernetes cloud JCasC configuration for Jenkins (connecting via Nginx endpoint)
      ansible.builtin.template:
        src: jenkins-k8s-cloud.yaml.j2
        dest: /var/lib/jenkins/casc_configs/10-k8s-cloud.yaml
        owner: "{{ jenkins_user | default('jenkins') }}"
        group: "{{ jenkins_group | default('jenkins') }}"
        mode: '0640'

    - name: Download jenkins-cli.jar if missing
      ansible.builtin.get_url:
        url: "http://127.0.0.1:{{ jenkins_http_port | default(8088) }}/jnlpJars/jenkins-cli.jar"
        dest: /usr/local/bin/jenkins-cli.jar
        mode: '0755'
      failed_when: false

    - name: Reload Jenkins JCasC configuration with active Kubernetes cluster through Nginx
      ansible.builtin.command: >-
        java -jar /usr/local/bin/jenkins-cli.jar -s https://{{ jenkins_domain | default('jenkins.' ~ internal_domain) }}/
        -noCertificateCheck -auth {{ jenkins_admin_user | default('admin') }}:{{ jenkins_admin_password | default('admin') }}
        reload-jcasc-configuration
      failed_when: false
      changed_when: true
  when: jenkins_enable | default(true) | bool
