---
# Tasks for generating unified multi-cluster kubeconfigs for local & remote usage

- name: Deploy kubeconfig generator script
  ansible.builtin.template:
    src: generate-kubeconfig.py.j2
    dest: /tmp/generate-kubeconfig.py
    owner: root
    group: root
    mode: '0700'

- name: Generate multi-cluster kubeconfigs for local and remote usage
  ansible.builtin.command: python3 /tmp/generate-kubeconfig.py
  changed_when: true

- name: Fetch workstation kubeconfig to controller
  ansible.builtin.fetch:
    src: /tmp/ratlab-workstation.kubeconfig
    dest: "{{ playbook_dir }}/../files/kubeconfig"
    flat: true

- name: Remove temporary generator script
  ansible.builtin.file:
    path: /tmp/generate-kubeconfig.py
    state: absent
