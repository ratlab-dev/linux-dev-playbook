---
# Tasks for OpenBao TLS Setup & CSR Generation

- name: Check if OpenBao service is currently active on target
  ansible.builtin.command: systemctl is-active openbao
  register: openbao_service_active
  changed_when: false
  failed_when: false

- name: Check if OpenBao private key exists
  ansible.builtin.stat:
    path: "{{ openbao_tls_dir }}/vault.key"
  register: openbao_key_stat

- name: Check if OpenBao private key is backed up on controller
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../files/certs/vault.key"
  register: controller_vault_key
  delegate_to: localhost
  become: false

- name: Restore OpenBao private key from controller if missing on target
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/certs/vault.key"
    dest: "{{ openbao_tls_dir }}/vault.key"
    owner: "{{ openbao_user }}"
    group: "{{ openbao_group }}"
    mode: '0600'
  when:
    - not openbao_key_stat.stat.exists
    - controller_vault_key.stat.exists

- name: Refresh OpenBao key stat after potential restoration
  ansible.builtin.stat:
    path: "{{ openbao_tls_dir }}/vault.key"
  register: openbao_key_stat_refreshed

- name: Generate OpenBao private key if missing
  ansible.builtin.command: >-
    openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out {{ openbao_tls_dir }}/vault.key
  when: not openbao_key_stat_refreshed.stat.exists

- name: Backup OpenBao private key to controller to preserve across cleanups
  ansible.builtin.fetch:
    src: "{{ openbao_tls_dir }}/vault.key"
    dest: "{{ playbook_dir }}/../files/certs/vault.key"
    flat: true
  when: not controller_vault_key.stat.exists or not openbao_key_stat.stat.exists

- name: Secure OpenBao private key permissions
  ansible.builtin.file:
    path: "{{ openbao_tls_dir }}/vault.key"
    owner: "{{ openbao_user }}"
    group: "{{ openbao_group }}"
    mode: '0600'

- name: Check if OpenBao certificate exists on target
  ansible.builtin.stat:
    path: "{{ openbao_tls_dir }}/vault.crt"
  register: target_signed_openbao_cert

- name: Check if signed OpenBao certificate exists on controller
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../files/certs/openbao.crt"
  register: local_signed_openbao_cert
  delegate_to: localhost
  become: false

- name: Backup existing target OpenBao certificate to controller if missing on controller
  ansible.builtin.fetch:
    src: "{{ openbao_tls_dir }}/vault.crt"
    dest: "{{ playbook_dir }}/../files/certs/openbao.crt"
    flat: true
  when:
    - target_signed_openbao_cert.stat.exists
    - not local_signed_openbao_cert.stat.exists

- name: Restore OpenBao certificate from controller if missing on target
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/certs/openbao.crt"
    dest: "{{ openbao_tls_dir }}/vault.crt"
    owner: "{{ openbao_user }}"
    group: "{{ openbao_group }}"
    mode: '0644'
  when:
    - not target_signed_openbao_cert.stat.exists
    - local_signed_openbao_cert.stat.exists

- name: Refresh certificate stats
  block:
    - name: Refresh controller certificate stat
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../files/certs/openbao.crt"
      register: local_signed_openbao_cert
      delegate_to: localhost
      become: false

    - name: Refresh target certificate stat
      ansible.builtin.stat:
        path: "{{ openbao_tls_dir }}/vault.crt"
      register: target_signed_openbao_cert

- name: Check if existing OpenBao certificate is valid for more than 30 days
  ansible.builtin.command: >-
    openssl x509 -checkend {{ vault_tls_expiry_threshold_seconds | default(2592000) }} -noout -in {{ playbook_dir }}/../files/certs/openbao.crt
  register: openbao_cert_checkend
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false
  when: local_signed_openbao_cert.stat.exists

- name: Verify that existing certificate matches the private key on controller
  ansible.builtin.shell: |
    KEY_MOD=$(openssl pkey -in {{ playbook_dir }}/../files/certs/vault.key -pubout -outform PEM 2>/dev/null | openssl md5 || true)
    CERT_MOD=$(openssl x509 -in {{ playbook_dir }}/../files/certs/openbao.crt -pubkey -noout 2>/dev/null | openssl md5 || true)
    if [ -n "$KEY_MOD" ] && [ -n "$CERT_MOD" ] && [ "$KEY_MOD" = "$CERT_MOD" ]; then
      exit 0
    else
      exit 1
    fi
  register: cert_matches_key_local
  delegate_to: localhost
  become: false
  failed_when: false
  changed_when: false
  when:
    - local_signed_openbao_cert.stat.exists

- name: Verify that existing certificate matches the private key on target
  ansible.builtin.shell: |
    KEY_MOD=$(openssl pkey -in {{ openbao_tls_dir }}/vault.key -pubout -outform PEM 2>/dev/null | openssl md5 || true)
    CERT_MOD=$(openssl x509 -in {{ openbao_tls_dir }}/vault.crt -pubkey -noout 2>/dev/null | openssl md5 || true)
    if [ -n "$KEY_MOD" ] && [ -n "$CERT_MOD" ] && [ "$KEY_MOD" = "$CERT_MOD" ]; then
      exit 0
    else
      exit 1
    fi
  register: cert_matches_key_target
  failed_when: false
  changed_when: false
  when: target_signed_openbao_cert.stat.exists

- name: Determine if Vault TLS certificate requires YubiKey signing
  ansible.builtin.set_fact:
    vault_tls_needs_signing: >-
      {{
        not (
          (local_signed_openbao_cert.stat.exists or target_signed_openbao_cert.stat.exists) and
          (openbao_cert_checkend.rc | default(1) == 0) and
          (
            (cert_matches_key_local.rc | default(1) == 0) or
            (cert_matches_key_target.rc | default(1) == 0) or
            (openbao_service_active.rc | default(1) == 0 and target_signed_openbao_cert.stat.exists)
          )
        )
      }}

- name: Display certificate status banner
  ansible.builtin.debug:
    msg: >-
      {% if not vault_tls_needs_signing %}
      Vault TLS certificate is present and valid for > 30 days (Vault service active: {{ openbao_service_active.rc | default(1) == 0 }}). Reusing existing certificate (No YubiKey required).
      {% else %}
      Vault TLS certificate is missing, expiring within 30 days, or key mismatch. Interactive YubiKey signing required.
      {% endif %}

- name: Deploy OpenSSL CSR configuration
  ansible.builtin.template:
    src: csr.conf.j2
    dest: "{{ openbao_tls_dir }}/csr.conf"
    owner: "{{ openbao_user }}"
    group: "{{ openbao_group }}"
    mode: '0640'
  when: vault_tls_needs_signing | bool

- name: Generate Certificate Signing Request (CSR) for OpenBao
  ansible.builtin.command: >-
    openssl req -new
    -key {{ openbao_tls_dir }}/vault.key
    -out {{ openbao_tls_dir }}/vault.csr
    -config {{ openbao_tls_dir }}/csr.conf
  args:
    creates: "{{ openbao_tls_dir }}/vault.csr"
  when: vault_tls_needs_signing | bool

- name: Fetch OpenBao CSR to controller for YubiKey Root CA signing
  ansible.builtin.fetch:
    src: "{{ openbao_tls_dir }}/vault.csr"
    dest: "{{ playbook_dir }}/../files/certs/openbao.csr"
    flat: true
  when: vault_tls_needs_signing | bool

- name: Perform Interactive YubiKey Signing for Vault TLS Certificate
  block:
    - name: Prompt user to connect YubiKey
      ansible.builtin.pause:
        prompt: |

          ================================================================================
          YUBIKEY ROOT CA SIGNING REQUIRED FOR VAULT TLS (vault.ratlab.dev)
          Certificate validity: {{ vault_tls_validity_days | default(730) }} days (2 years).

          1. Ensure your YubiKey is connected to this Mac.
          2. Press [ENTER] to proceed with signing...
          ================================================================================

    - name: Execute YubiKey signing script locally on Mac
      ansible.builtin.command: >-
        {{ playbook_dir }}/../scripts/sign_with_yubikey.sh
        {{ playbook_dir }}/../files/certs/openbao.csr
        {{ playbook_dir }}/../files/certs/openbao.crt
        {{ vault_tls_validity_days | default(730) }}
        server
      delegate_to: localhost
      become: false
      register: yubikey_sign_result
      changed_when: true
  when: vault_tls_needs_signing | bool

- name: Deploy signed OpenBao certificate to devbox
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/certs/openbao.crt"
    dest: "{{ openbao_tls_dir }}/vault.crt"
    owner: "{{ openbao_user }}"
    group: "{{ openbao_group }}"
    mode: '0644'
  notify: Reload nginx

- name: Deploy OpenBao configuration file (openbao.hcl)
  ansible.builtin.template:
    src: openbao.hcl.j2
    dest: "{{ openbao_config_dir }}/openbao.hcl"
    owner: "{{ openbao_user }}"
    group: "{{ openbao_group }}"
    mode: '0640'
  notify: Restart openbao

- name: Create symlink from config.hcl to openbao.hcl
  ansible.builtin.file:
    src: "{{ openbao_config_dir }}/openbao.hcl"
    dest: "{{ openbao_config_dir }}/config.hcl"
    state: link
    force: true

- name: Ensure OpenBao environment file exists for systemd service
  ansible.builtin.file:
    path: "{{ openbao_config_dir }}/openbao.env"
    state: touch
    owner: "{{ openbao_user }}"
    group: "{{ openbao_group }}"
    mode: '0640'
    modification_time: preserve
    access_time: preserve

- name: Ensure OpenBao service is started and enabled
  ansible.builtin.service:
    name: openbao
    enabled: true
    state: started
